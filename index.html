<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Julianne Legados</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@400;600;700&display=swap"
    rel="stylesheet"
  >
</head>
<body>

  <main class="page home-page">

    <section class="scene home-scene">
      
      <div class="hero-layout">

        <nav class="icon-nav">

          <a href="about.html" class="nav-item">
            <div class="mini-bear">
              <span class="mini-ear left"></span>
              <span class="mini-ear right"></span>

              <div class="mini-face">
                <span class="mini-eye left"></span>
                <span class="mini-eye right"></span>
                <span class="mini-muzzle">ᴥ</span>
              </div>
            </div>
            <span>about me</span>
          </a>

          <a href="experience.html" class="nav-item">
            <div class="nav-icon laptop-icon">
              <div class="laptop-screen">&lt;/&gt;</div>
              <div class="laptop-base"></div>
            </div>
            <span>experience</span>
          </a>

          <a href="projects.html" class="nav-item">
            <div class="nav-icon folder-icon">
              <div class="folder-tab"></div>
              <div class="folder-body">★</div>
            </div>
            <span>my projects</span>
          </a>

          <a href="contact.html" class="nav-item">
            <div class="nav-icon mail-icon">
              <span>♡</span>
            </div>
            <span>contact me</span>
          </a>

        </nav>


        <div class="window home-window">

          <div class="window-bar">
            <div class="window-dots">
              <span class="window-dot red"></span>
              <span class="window-dot yellow"></span>
              <span class="window-dot green"></span>
            </div>

            <span class="window-title">home.</span>
          </div>


          <div class="window-content hero-content">
            <p class="tiny-intro">hello! ♡</p>

            <h2>hi, i'm julianne</h2>

            <p class="hero-subtitle">
              software engineer & computer science graduate
            </p>

            <div class="hero-buttons">
              <a
                href="docs/julianne_legados_resume.pdf"
                target="_blank"
                class="cute-button blue"
              >
                View Resume
              </a>
            </div>
          </div>

        </div>
      </div>


      <div class="bear-wrapper hero-bear">
        <div class="bear">
          <div class="bear-ear left">
            <div class="inner-ear"></div>
          </div>

          <div class="bear-ear right">
            <div class="inner-ear"></div>
          </div>

          <div class="bear-head">
            <span class="bear-eye left"></span>
            <span class="bear-eye right"></span>

            <span class="bear-cheek left"></span>
            <span class="bear-cheek right"></span>

            <div class="bear-muzzle">
              <span class="bear-nose"></span>
              <span class="bear-mouth">ω</span>
            </div>
          </div>

          <div class="bear-body">
            <div class="bear-belly"></div>
            <div class="bear-leg left"></div>
            <div class="bear-leg right"></div>
          </div>

          <div class="bear-laptop">♡</div>
        </div>
      </div>


      <div class="flower flower-left">
        <span class="flower-head">✿</span>
        <span class="flower-stem"></span>
      </div>

      <div class="flower flower-right">
        <span class="flower-head">✿</span>
        <span class="flower-stem"></span>
      </div>

      <div class="grass"></div>

    </section>

  </main>

</html>
